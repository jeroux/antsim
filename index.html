<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AntSim</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #14110f; color: #e8e0d0; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
    #app { position: relative; width: 100vw; height: 100vh; display: grid; place-items: center; }
    #stage { position: relative; aspect-ratio: 1280 / 800; max-width: 100vw; max-height: 100vh; width: 100vw; }
    canvas { display: block; width: 100%; height: 100%; image-rendering: auto; }
    .bar { position: absolute; left: 0; right: 0; top: 0; display: flex; gap: 14px; align-items: center; padding: 6px 12px; background: rgba(10, 8, 6, .55); backdrop-filter: blur(4px); font-variant-numeric: tabular-nums; }
    .bar .clock { font-weight: 600; letter-spacing: .02em; }
    .bar .spacer { flex: 1; }
    .bar button, .tool { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); color: inherit; border-radius: 6px; padding: 3px 9px; cursor: pointer; }
    .bar button.on { background: rgba(255, 210, 120, .35); border-color: rgba(255,210,120,.6); }
    .bar button:disabled { opacity: .35; cursor: default; }
    .bar label { display: flex; gap: 6px; align-items: center; opacity: .9; }
    .bar input[type=range] { width: 110px; }
    #tools { position: absolute; left: 10px; top: 46px; display: flex; flex-direction: column; gap: 6px; }
    .tool { display: flex; gap: 8px; align-items: center; padding: 5px 8px; width: 150px; cursor: grab; user-select: none; background: rgba(10,8,6,.5); }
    .tool:active { cursor: grabbing; }
    .tool .ico { font-size: 18px; width: 22px; text-align: center; }
    #count { position: absolute; right: 12px; bottom: 10px; background: rgba(10,8,6,.45); padding: 6px 10px; border-radius: 8px; font-size: 12px; opacity: .85; font-variant-numeric: tabular-nums; }
    #count div { display: flex; justify-content: space-between; gap: 14px; }
    #count .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
    #count .total { font-weight: 600; border-top: 1px solid rgba(255,255,255,.15); margin-top: 3px; padding-top: 3px; }
    #log { position: absolute; left: 12px; bottom: 10px; font-size: 12px; opacity: .6; max-width: 40%; pointer-events: none; }
  </style>
  <script type="module" crossorigin src="/antsim/assets/index-Bh82_7NP.js"></script>
</head>
<body>
  <div id="app"><div id="stage"><canvas id="c" width="1280" height="800"></canvas></div></div>
</body>
</html>
